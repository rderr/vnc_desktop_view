[package]
name = "desktop-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Compiled-in OpenH264 (--features openh264) is for local testing only and never
# shipped; Linux builds load Cisco's own binary instead (see src/encoder.rs).
openh264 = { version = "0.9.10", default-features = false, optional = true }
opus = "0.4.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
libloading = "0.9.1"
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"] }
x11rb = { version = "0.14.0", features = ["shm", "damage", "xfixes", "xtest", "randr", "allow-unsafe-code"] }

[dev-dependencies]
png = "0.18.1"

[features]
openh264 = ["dep:openh264", "openh264/source"]

[[example]]
name = "verify"
required-features = ["openh264"]

[[example]]
name = "bench"
required-features = ["openh264"]

[profile.release]
strip = true
